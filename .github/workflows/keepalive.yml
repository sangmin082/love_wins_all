name: Server Keepalive

on:
  schedule:
    - cron: "*/10 * * * *" # 10분마다 서버를 깨워 Render 무료 티어 슬립 방지
  workflow_dispatch:

# 자기 자신을 재활성화(enable API)하기 위한 권한
permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 서버 핑
        run: |
          curl -sS -m 90 -o /dev/null -w "HTTP %{http_code}, %{time_total}s\n" \
            https://love-wins-all-opgx.onrender.com/ || true
          curl -sS -m 30 -o /dev/null -w "app-ads.txt: HTTP %{http_code}\n" \
            https://love-wins-all-opgx.onrender.com/app-ads.txt || true

      # GitHub는 저장소에 60일간 커밋이 없으면 스케줄 워크플로를 자동 비활성화한다.
      # 실행 때마다 스스로를 다시 활성화해 비활성화 타이머를 리셋한다.
      - name: 워크플로 자동 비활성화 방지
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
