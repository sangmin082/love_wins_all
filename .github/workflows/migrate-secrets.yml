# 일회용: 이 저장소의 공통 시크릿을 ios-certificates 저장소로 복사한다.
# (새 앱들이 ios-certificates의 시크릿 복사 워크플로를 쓰도록 하는 이관 작업.
#  값은 러너 안에서만 다뤄지고 로그에는 시크릿 이름만 출력된다. 완료 후 이 파일은 삭제할 것)
name: Migrate Secrets
on: workflow_dispatch

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ios-certificates로 시크릿 복사
        env:
          IN_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          IN_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IN_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          IN_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          IN_MATCH_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          set -euo pipefail
          DEST=sangmin082/ios-certificates

          # PAT 추출 — "계정:PAT" / PAT 단독 / base64 모두 허용 (Fastfile과 동일 규칙)
          raw="$(printf %s "$IN_MATCH_AUTH" | tr -d '[:space:]')"
          if [[ "$raw" == *:* ]]; then pat="${raw#*:}"
          elif [[ "$raw" == ghp_* || "$raw" == github_pat_* ]]; then pat="$raw"
          else
            dec="$(printf %s "$raw" | base64 -d 2>/dev/null || true)"
            if [[ "$dec" == *:* ]]; then pat="${dec#*:}"; else pat="$dec"; fi
          fi
          [[ -n "$pat" ]] || { echo "PAT 추출 실패"; exit 1; }

          # .p8 — base64로 저장돼 있으면 원문으로 디코드
          if printf %s "$IN_KEY" | grep -q "BEGIN PRIVATE KEY"; then p8="$IN_KEY"
          else p8="$(printf %s "$IN_KEY" | base64 -d)"; fi
          printf %s "$p8" | grep -q "BEGIN PRIVATE KEY" || { echo "p8 형식 오류"; exit 1; }

          export GH_TOKEN="$pat"
          gh secret set ASC_KEY_ID     --repo "$DEST" --body "$IN_KEY_ID"
          gh secret set ASC_ISSUER_ID  --repo "$DEST" --body "$IN_ISSUER_ID"
          printf %s "$p8" | gh secret set ASC_KEY_P8 --repo "$DEST"
          gh secret set MATCH_PASSWORD --repo "$DEST" --body "$IN_MATCH_PASSWORD"
          gh secret set GH_PAT         --repo "$DEST" --body "$pat"

          echo "── $DEST 에 등록된 시크릿 목록 ──"
          gh secret list --repo "$DEST"
